    <meta property="og:image:alt" content="A formal invitation in green and gold, reading: You are cordially invited to suffer with me. Runs, workouts, type 2 fun. Because I really like you. Beside it, in a little gold theatre, two fluffy creatures: a cream one holding a sealed envelope and a pink one in a sweatband." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You are cordially invited to suffer" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/models/suffer.glb" as="fetch" crossorigin />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #113428;
        color: #f4ead2;
      }
      /* the first paint: the card, its border, and a small line of type that counts */
      .boot {
        position: fixed;
        inset: 0;
        margin: 0;
        display: grid;
        place-items: center;
        font: italic 15px/1 Georgia, 'Times New Roman', serif;
        letter-spacing: 0.08em;
        color: #d8b25a;
      }
      .boot::before {
        content: '';
        position: absolute;
        inset: 13px;
        border: 5px solid #d8b25a;
      }
      /* nothing of the page shows until it is laid out */
      #app {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <p class="boot" data-boot>Engraving your invitation&ensp;<span data-boot-count>0</span></p>
    <div id="app">
      <!-- the card and its gold border: a still picture in the same coarse pixels as the 3D -->
      <canvas id="paper" aria-hidden="true"></canvas>
      <!-- everything that scrolls: the type, and an empty box on each page for its little theatre -->
      <main id="scroll" tabindex="-1"></main>
      <!-- the little theatres, drawn over the page and pinned to those boxes -->
      <canvas id="stage" aria-hidden="true"></canvas>
      <p class="clock" data-clock aria-hidden="true"></p>
      <nav class="dots" data-dots aria-label="The programme"></nav>
    </div>
    <noscript><p style="position: fixed; inset: 0; display: grid; place-items: center; font: 18px Georgia, serif; padding: 2em; text-align: center">You are cordially invited to suffer. The invitation needs JavaScript; the suffering does not.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
